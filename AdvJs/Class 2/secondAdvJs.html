        let url="https://catfact.ninja/fact"
        let main=document.querySelector("main")
        let ul=document.createElement("ul")
        let h1=document.querySelector("h1")
        function createFact(){
            let li=document.createElement("li")
            fetch(url)
            .then((res)=>{
                return res.json()
            })
            .then((data)=>{
                li.innerHTML=`<b>Fact : </b>${data.fact}`
                ul.prepend(li)
                console.log(data)
                h1.innerText=`${ul.children.length} Facts`
            })
            .catch((err)=>{
                console.log(err)
            })
        }
